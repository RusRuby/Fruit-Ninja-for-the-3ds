name: Build 3DS CIA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CIA
        run: |
          make cia || make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FruitNinja-3DS
          path: |
            *.cia
            *.3dsx
