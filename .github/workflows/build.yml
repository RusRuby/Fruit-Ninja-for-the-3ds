name: Build 3DS CIA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 3DS Build Tools
        run: |
          dkp-pacman -Sy --noconfirm 3ds-tools bannertool makerom

      - name: Compile 3DSX & CIA
        run: |
          make cia || make

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FruitNinja-3DS-Build
          path: |
            *.cia
            *.3dsx
